<!DOCTYPE html>
<html lang="pt-BR" data-theme="solarized-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Loop — Aprenda a programar</title>
    <meta name="description" content="Coding Loop — aulas práticas de HTML, CSS e JavaScript, com IDE integrada e acompanhamento de progresso.">

    <!-- Preconnect: economiza o tempo de DNS/TLS antes do primeiro
         download do SDK do Firebase, que carrega logo abaixo. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <link rel="stylesheet" href="assets/css/global.css">

    <!-- CSS do modal de login — autocontido; usa variáveis do tema se
         existirem (--cl-*), com fallback pra não quebrar sem elas. -->
    <style>
        #cl-login-modal[hidden] { display: none; }

        #cl-login-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #cl-login-modal .cl-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
        }

        .cl-login-modal-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            background: var(--cl-surface, #073642);
            color: var(--cl-text, #eee8d5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .cl-login-modal-box .cl-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 0;
        }

        .cl-login-modal-box .cl-modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .cl-btn-icon-only {
            background: none;
            border: none;
            color: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
        }

        .cl-login-modal-box .cl-modal-body {
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cl-login-social {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cl-btn-social {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--cl-border, #586e75);
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.15s ease;
        }

        .cl-btn-social:hover { background: rgba(255, 255, 255, 0.06); }

        .cl-btn-social .cl-btn-icon {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }

        .cl-login-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--cl-text-muted, #93a1a1);
            font-size: 0.85rem;
        }

        .cl-login-divider::before,
        .cl-login-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--cl-border, #586e75);
        }

        .cl-login-panel[hidden] { display: none; }

        .cl-login-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cl-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.85rem;
        }

        .cl-field input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--cl-border, #586e75);
            background: var(--cl-bg, #002b36);
            color: inherit;
            font-size: 0.95rem;
        }

        .cl-login-links {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cl-login-links button {
            background: none;
            border: none;
            color: var(--cl-primary, #2aa198);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0;
            text-decoration: underline;
        }

    </style>

    <!-- Firebase SDK (compat) -->
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics-compat.js"></script>
</head>
<body>

    <div id="coding-loop">

        <!-- ===================================================== -->
        <!-- LANDING PAGE — página de entrada do site.              -->
        <!-- Visitante não-autenticado sempre cai aqui. Quem já tem -->
        <!-- sessão válida (Firebase Auth) é redirecionado direto   -->
        <!-- pro Dashboard no boot, sem ver esta tela.               -->
        <!-- ===================================================== -->

        <section id="cl-landing">

            <header id="cl-landing-header">

                <div class="cl-header-brand" id="cl-landing-brand">
                    <a class="cl-logo" href="index.html">
                        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg6EZEO0k3h-2142ikDia1_NDzm_pniss2aR8eIR12PXpk97BEjAT51neoYW2bRguL3u1eFO3SCzhiFOqf7P_j6vklF-23ODK4WPbvt0aegQp8JPZXU12A0QzTc2XJ8wONm3E8utAWze1atLQvvIw8v-sFQtmMcqpEbAvRSVkDllmJA_A/s1600/Logo-Azul.png" alt="Coding Loop">
                    </a>
                    <h2>Coding-Loop</h2>
                </div>

                <div class="cl-header-spacer"></div>

                <div class="cl-landing-actions" id="cl-landing-actions">

                    <!-- TEMA CLARO/ESCURO -->
                    <button aria-label="Alternar tema claro/escuro" class="cl-btn" data-theme-toggle type="button">
                        <span class="cl-btn-icon">☀</span>
                    </button>

                    <!-- ABRE O MODAL DE LOGIN -->
                    <button class="cl-btn cl-btn-filled cl-primary" id="cl-landing-btn-login" type="button">
                        <span class="cl-btn-icon">🔐</span>
                        <span class="cl-btn-label">Entrar</span>
                    </button>

                </div>

            </header>

            <main id="cl-landing-main">

                <a href="#">
                    <img class="img-landingPage" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgB0iHjs9BQhNI74ZjZK-RoqLkWoqA1_GUVuBAT7vtEa7npruDuM8Hv06rDEXaBqGDrXVY17-f7yPHYIWhVL5x-uPvAOioq6fn-tyeD20P53L61ot0RvwJC2EhOII02eedVbYPtqQIcIUD4e4oKyn8rMQ550gIRyBAVtDL6sLNTC55teQ/s1600/landingPagi-CodingLoop.png" alt="Coding Loop">
                </a>

                <div class="cl-tech-badges">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/61/HTML5_logo_and_wordmark.svg" alt="HTML5" class="html-course-icon">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/CSS3_logo_and_wordmark.svg" alt="CSS3" class="css-course-icon">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/JavaScript-logo.png" alt="JavaScript" class="js-course-icon">
                </div>

            </main>

        </section>

        <!-- ===================================================== -->
        <!-- MODAL DE LOGIN — métodos de autenticação:                -->
        <!-- OAuth (Google/Facebook/GitHub/Microsoft) e email/senha.  -->
        <!-- Começa oculto (hidden).                                  -->
        <!-- ===================================================== -->
        <div hidden id="cl-login-modal">
            <div class="cl-modal-overlay" data-login-close></div>

            <div class="cl-modal cl-login-modal-box" role="dialog" aria-modal="true" aria-labelledby="cl-login-modal-title">

                <div class="cl-modal-header">
                    <h2 id="cl-login-modal-title">Entrar no Coding Loop</h2>
                    <button class="cl-btn-icon-only" data-login-close type="button" aria-label="Fechar">✖</button>
                </div>

                <div class="cl-modal-body">

                    <!-- PROVEDORES OAUTH -->
                    <div class="cl-login-social">
                        <button class="cl-btn cl-btn-social" data-provider="google" type="button">
                            <span class="cl-btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
                            </span>
                            <span class="cl-btn-label">Continuar com Google</span>
                        </button>
                        <button class="cl-btn cl-btn-social" data-provider="facebook" type="button">
                            <span class="cl-btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            </span>
                            <span class="cl-btn-label">Continuar com Facebook</span>
                        </button>
                        <button class="cl-btn cl-btn-social" data-provider="github" type="button">
                            <span class="cl-btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.744.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.42-1.305.762-1.605-2.665-.303-5.467-1.332-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.123-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.3 1.23A11.5 11.5 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.654 1.653.242 2.874.12 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.624-5.48 5.92.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.696.825.577C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                            </span>
                            <span class="cl-btn-label">Continuar com GitHub</span>
                        </button>
                        <button class="cl-btn cl-btn-social" data-provider="microsoft" type="button">
                            <span class="cl-btn-icon" aria-hidden="true">
                                <svg viewBox="0 0 23 23" width="18" height="18"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="12" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="12" width="10" height="10" fill="#00A4EF"/><rect x="12" y="12" width="10" height="10" fill="#FFB900"/></svg>
                            </span>
                            <span class="cl-btn-label">Continuar com Microsoft</span>
                        </button>
                    </div>

                    <div class="cl-login-divider"><span>ou</span></div>

                    <!-- FORMULÁRIO: EMAIL/SENHA -->
                    <form class="cl-login-panel cl-is-active" data-login-panel="email" id="cl-login-form-email">

                        <label class="cl-field">
                            <span>Email</span>
                            <input autocomplete="email" id="cl-email-input" required type="email">
                        </label>

                        <label class="cl-field">
                            <span>Senha</span>
                            <input autocomplete="current-password" id="cl-password-input" minlength="6" required type="password">
                        </label>

                        <button class="cl-btn cl-btn-filled cl-primary" id="cl-email-submit" type="submit">
                            <span class="cl-btn-label" id="cl-email-submit-label">Entrar</span>
                        </button>

                        <div class="cl-login-links">
                            <button data-login-mode="register" id="cl-email-toggle-mode" type="button">Criar uma conta</button>
                            <button id="cl-email-forgot" type="button">Esqueci minha senha</button>
                        </div>

                    </form>

                </div>

            </div>
        </div>

        <!-- LOADING -->
        <div data-state="visible" data-type="fullscreen" id="cl-loading">
            <div class="cl-loading-container">
                <div class="cl-loading-spinner"></div>
                <p class="cl-loading-label" id="cl-loading-text">Carregando...</p>
            </div>
        </div>

        <!-- ERROR -->
        <div hidden id="cl-errors">
            <div class="cl-error">
                <div class="cl-error-header">
                    <h2 id="cl-error-title">Erro</h2>
                </div>
                <div class="cl-error-body">
                    <p id="cl-error-message"></p>
                </div>
                <div class="cl-error-footer">
                    <button class="cl-btn cl-btn-filled cl-primary" id="cl-error-close" type="button">
                        <span class="cl-btn-icon">✖</span>
                        <span class="cl-btn-label">Fechar</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- TOASTS -->
        <div id="cl-toast-root"></div>

    </div>

    <script defer src="assets/js/firebase-init.js"></script>
    <script defer src="assets/js/auth.js"></script>

    <script>
        /* =====================================================
           BOOT DA LANDING — versão enxuta, sem router/pages/
           components (isso é só do Dashboard). Aqui a página é
           bem mais simples: tema, um toast e o botão de login.
           ===================================================== */
        (function () {
            "use strict";

            window.CL = window.CL || {};
            const CL = window.CL;

            /* config mínimo — auth.js só depende de CL.config.storagePrefix,
               CL.config.debug e CL.config.landingUrl */
            CL.config = Object.freeze({
                appName: "Coding Loop",
                debug: false,
                defaultTheme: "solarized-dark",
                defaultLanguage: "pt-BR",
                storagePrefix: "cl",
                landingUrl: "index.html",
                dashboardUrl: "dashboard.html",
                protectedPage: false,
                toastDuration: 3000
            });

            CL.state = {
                theme: CL.config.defaultTheme,
                user: null,
                authenticated: false,
                initialized: false
            };

            /* ---- UI mínima (tema + toast) ---- */
            CL.ui = {};

            CL.ui.setTheme = function (theme) {
                CL.state.theme = theme;
                document.documentElement.setAttribute("data-theme", theme);
                CL.storage.set("theme", theme);
            };

            CL.ui.toggleTheme = function () {
                const next = CL.state.theme === "solarized-dark" ? "solarized-light" : "solarized-dark";
                CL.ui.setTheme(next);
            };

            CL.ui.showToast = function (message, type, duration) {
                type = type || "info";
                duration = duration || CL.config.toastDuration;

                const root = document.getElementById("cl-toast-root");
                if (!root) return;

                const icons = { info: "ℹ", success: "✔", warning: "⚠", danger: "✖" };

                const toast = document.createElement("div");
                toast.className = `cl-toast cl-toast-${type}`;
                toast.innerHTML = `
                    <span class="cl-toast-icon">${icons[type] || icons.info}</span>
                    <div class="cl-toast-content">
                        <span class="cl-toast-title"></span>
                    </div>
                    <button class="cl-toast-close" type="button">✖</button>
                `;
                toast.querySelector(".cl-toast-title").textContent = message;
                root.appendChild(toast);

                const remove = function () { toast.remove(); };
                toast.querySelector(".cl-toast-close").addEventListener("click", remove);
                setTimeout(remove, duration);
            };

            CL.ui.showFatalError = function (title, message) {
                const box = document.getElementById("cl-errors");
                if (!box) return;
                document.getElementById("cl-error-title").textContent = title;
                document.getElementById("cl-error-message").textContent = message;
                box.hidden = false;
            };

            /* ---- eventos da página ---- */

            /* Se o login (qualquer método) der certo, o onAuthStateChanged
               (em CL.auth.init) já atualiza CL.state; aqui só falta mandar
               pro Dashboard. */
            function goToDashboardIfLoggedIn(ok) {
                if (ok) {
                    window.location.href = CL.config.dashboardUrl;
                }
            }

            /* ===== abrir/fechar modal ===== */
            const loginModal = document.getElementById("cl-login-modal");

            function openLoginModal() {
                loginModal.hidden = false;
            }

            function closeLoginModal() {
                loginModal.hidden = true;
            }

            document.getElementById("cl-landing-btn-login").addEventListener("click", openLoginModal);

            loginModal.querySelectorAll("[data-login-close]").forEach(function (el) {
                el.addEventListener("click", closeLoginModal);
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && !loginModal.hidden) {
                    closeLoginModal();
                }
            });

            /* ===== provedores OAuth (Google/Facebook/GitHub/Microsoft) ===== */
            loginModal.querySelectorAll("[data-provider]").forEach(function (btn) {
                btn.addEventListener("click", async function () {
                    const providerKey = btn.getAttribute("data-provider");
                    btn.disabled = true;
                    const ok = await CL.auth.loginWithProvider(providerKey);
                    btn.disabled = false;
                    goToDashboardIfLoggedIn(ok);
                });
            });

            /* ===== email/senha (entrar / criar conta) ===== */
            let emailMode = "login"; /* "login" | "register" */

            const emailForm = document.getElementById("cl-login-form-email");
            const emailSubmitLabel = document.getElementById("cl-email-submit-label");
            const emailToggleBtn = document.getElementById("cl-email-toggle-mode");

            function setEmailMode(mode) {
                emailMode = mode;
                emailSubmitLabel.textContent = mode === "register" ? "Criar conta" : "Entrar";
                emailToggleBtn.textContent = mode === "register" ? "Já tenho conta" : "Criar uma conta";
            }

            emailToggleBtn.addEventListener("click", function () {
                setEmailMode(emailMode === "register" ? "login" : "register");
            });

            emailForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                const email = document.getElementById("cl-email-input").value.trim();
                const password = document.getElementById("cl-password-input").value;
                const submitBtn = document.getElementById("cl-email-submit");

                submitBtn.disabled = true;
                const ok = emailMode === "register"
                    ? await CL.auth.registerWithEmail(email, password)
                    : await CL.auth.loginWithEmail(email, password);
                submitBtn.disabled = false;

                goToDashboardIfLoggedIn(ok);
            });

            document.getElementById("cl-email-forgot").addEventListener("click", async function () {
                const email = document.getElementById("cl-email-input").value.trim();
                if (!email) {
                    CL.ui.showToast("Digite seu email no campo acima primeiro.", "warning");
                    return;
                }
                await CL.auth.sendPasswordReset(email);
            });

            document.querySelector("[data-theme-toggle]").addEventListener("click", CL.ui.toggleTheme);

            document.getElementById("cl-error-close").addEventListener("click", function () {
                document.getElementById("cl-errors").hidden = true;
            });

            /* mostra o motivo do redirecionamento (?reason=), se houver,
               e limpa a URL pra não reaparecer num F5 */
            function showRedirectReason() {
                const params = new URLSearchParams(window.location.search);
                const reason = params.get("reason");
                if (!reason) return;

                const messages = {
                    expired: "Sua sessão expirou. Faça login novamente para continuar.",
                    unauthenticated: "Você precisa estar logado para acessar essa área.",
                    logout: "Você saiu da sua conta."
                };

                if (messages[reason]) {
                    CL.ui.showToast(messages[reason], reason === "logout" ? "info" : "warning", 6000);
                }

                history.replaceState(null, "", window.location.pathname);
            }

            /* ---- boot ---- */
            async function boot() {
                try {
                    CL.ui.setTheme(CL.storage.get("theme", CL.config.defaultTheme));

                    CL.auth.init();
                    await CL.auth.ready;

                    /* já logado -> nem mostra a Landing, pula pro Dashboard */
                    if (CL.auth.isAuthenticated()) {
                        window.location.href = CL.config.dashboardUrl;
                        return;
                    }

                    showRedirectReason();

                } catch (error) {
                    if (CL.config.debug) console.error("[boot] falha:", error);
                    CL.ui.showFatalError("Erro ao iniciar", "Não foi possível carregar a página. Recarregue.");
                } finally {
                    const loading = document.getElementById("cl-loading");
                    if (loading) loading.hidden = true;
                }
            }

            document.addEventListener("DOMContentLoaded", boot);

        })();
    </script>

</body>
</html>
