<!DOCTYPE html>
<html lang="pt-BR" data-theme="solarized-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDE — Coding Loop</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/ide.css">

    <!-- Preconnect: economiza o tempo de DNS/TLS antes dos downloads
         do Firebase e do Ace, que carregam logo abaixo. -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <!-- Firebase SDK (compat) -->
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <!-- Editor Ace -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/mode-html.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/mode-css.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/mode-javascript.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/worker-javascript.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/worker-css.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/theme-solarized_dark.js"></script>

</head>
<body>

  <div class="learning-platform-root">

    <!-- Painel Esquerdo: Guia Teórico e Aulas Interativas -->
    <aside class="theory-pane">
      <header class="theory-header">
        
        <!-- 1. Estrutura Fixa / Permanente: dois botões independentes -->
        <div class="dashboard-fixed-section">
          <!-- Botão A: ícone do HTML + seta "<" colada na borda esquerda -> volta para a dashboard -->
          <button aria-label="Voltar para a dashboard" class="back-to-dashboard-btn" id="btn-voltar-dashboard" title="Voltar para a dashboard" type="button">
            <svg class="seta-retorno" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgtb8yBu7e-MyIPPoH4eUbVea9qSF9dWYLshC0w-dBvdHxAUhajHEvgPsM04ZnJpY4vP0DmpZkoK89_O6ppy7KDKuUsV5qeP0RFdXjW0rLNdKE_WaGt3WET4JeM1zkruANEyfebFTqU0NPunLJk-xzJmT2-xaDa62EYe0iCNzHgRvnzVw/s1600/Html5.png" alt="HTML"/>
          </button>

          <!-- Botão B: ícone de menu (☰) -> abre/fecha o índice do curso -->
          <button aria-label="Abrir índice do curso" class="toggle-indice-btn" id="toggle-indice" title="Índice do curso" type="button" aria-expanded="false" aria-controls="indice-etapas">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z"/></svg>
          </button>
        </div>

        <!-- 2. Barra Dinâmica do Módulo -->
        <div class="module-nav-bar">
          <button id="prev-btn" class="header-nav-btn" title="Anterior" disabled>
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>

          <h2 id="module-title">Módulo 1: Introdução ao HTML</h2>

          <button id="next-btn" class="header-nav-btn" title="Próxima Etapa">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
          </button>
        </div>

      </header>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-bar"></div>
      </div>

      <!-- Índice do curso (novo): lista todos os módulos e suas etapas;
           clicar em um item navega direto para aquela etapa (trocando de
           módulo se necessário). Fica escondido por padrão e a lista é
           populada via JS (renderIndice). O botão no topo retorna à dashboard. -->
      <nav id="indice-etapas" class="indice-panel" hidden aria-label="Índice do curso">
        <div class="indice-header">
          <button type="button" id="indice-back-to-dashboard" class="indice-back-btn" title="Voltar para a dashboard" aria-label="Voltar para a dashboard">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            <span>Voltar para a dashboard</span>
          </button>
        </div>
        <div id="indice-lista"></div>
      </nav>

      <div class="theory-content" id="theory-content">
        <!-- Conteúdo das etapas é gerado dinamicamente pelo array ETAPAS (ver <script> abaixo) -->
      </div>
    </aside>

    <div aria-label="Redimensionar painéis" aria-orientation="vertical" class="pane-resizer" id="pane-resizer" role="separator"></div>

    <!-- Painel Direito: IDE avançado -->
    <main class="ide-container-pane">
      <div id="editorCodigoWrapper">
        <div class="browser-window" id="main-window-container">
          <div class="save-toast" id="save-toast" aria-live="polite" role="status"></div>
          <div class="browser-tabs">
            <div class="browser-tabs-left">
              <button aria-label="Recolher ou expandir IDE" aria-pressed="false" class="collapse-btn" id="btn-ide-collapse" title="Recolher/Expandir IDE" type="button"> 
                <svg id="icon-collapse" viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                <svg id="icon-expand" style="display:none;" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> &nbsp; ⌨ 
              </button>

              <button aria-label="Alternar tela cheia do IDE" class="maximize-btn" id="btn-maximize-toggle" title="Alternar tela cheia do IDE" type="button">
                <svg id="icon-maximize" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                <svg id="icon-minimize" style="display:none;" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
              </button>
            </div>

            <div class="browser-tabs-scroll-wrapper" id="tabs-scroll-wrapper">
              <div class="browser-tabs-right" id="tabs-draggable-container">
                <button aria-label="Importar arquivo HTML, CSS ou JavaScript" class="toolbar-btn" id="btn-import-file" title="Importar arquivo" type="button">
                  <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
                </button>

                <button aria-label="Exportar código editado" class="toolbar-btn" id="btn-export-file" title="Exportar código" type="button">
                  <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM10 16h4V9h4l-6-6-6 6h4v7z"/></svg>
                </button>

                <button aria-label="Salvar progresso do código" class="toolbar-btn" id="btn-save-file" title="Salvar progresso" type="button">
                  <svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm3-10H5V5h10v4z"/></svg>
                  <span class="save-btn-dot" id="save-btn-dot" aria-hidden="true"></span>
                </button>

                <input accept=".html,.htm,.css,.js" class="file-input-hidden" id="input-import-file" type="file"/>

                <div class="tab-btn code-tab" data-target="html-pane" draggable="true">
                  <input checked="checked" class="editor-toggle-checkbox" id="chk-toggle-html" type="checkbox"/>
                  <span class="tab-text">HTML</span>
                  <button aria-label="Limpar HTML" class="tab-action-btn clear-editor-btn" data-editor="html" draggable="false" title="Limpar HTML" type="button">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5z"/></svg>
                  </button>
                </div>

                <div class="tab-btn code-tab" data-target="css-pane" draggable="true">
                  <input class="editor-toggle-checkbox" id="chk-toggle-css" type="checkbox"/>
                  <span class="tab-text">CSS</span>
                  <button aria-label="Limpar CSS" class="tab-action-btn clear-editor-btn" data-editor="css" draggable="false" title="Limpar CSS" type="button">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5z"/></svg>
                  </button>
                </div>

                <div class="tab-btn code-tab" data-target="js-pane" draggable="true">
                  <input class="editor-toggle-checkbox" id="chk-toggle-js" type="checkbox"/>
                  <span class="tab-text">JavaScript</span>
                  <button aria-label="Limpar JavaScript" class="tab-action-btn clear-editor-btn" data-editor="js" draggable="false" title="Limpar JavaScript" type="button">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4h-3.5z"/></svg>
                  </button>
                </div>
              </div>

              <div class="scroll-fade scroll-fade-left" aria-hidden="true"><span class="scroll-fade-arrow">‹</span></div>
              <div class="scroll-fade scroll-fade-right" aria-hidden="true"><span class="scroll-fade-arrow">›</span></div>
            </div>

            <div class="browser-tabs-fixed-right">
              <label class="tab-btn live-toggle-btn" draggable="false" id="btn-run" for="chk-toggle-preview" title="Habilitar preview">
                <input checked="checked" class="editor-toggle-checkbox" id="chk-toggle-preview" type="checkbox"/>
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span class="tab-text">Live</span>
              </label>
            </div>
          </div>

          <div class="window-content" id="window-content-wrapper">
            <div class="editors-area" id="editors-container">
              <div class="tab-pane" id="html-pane"><div class="ace-container" id="html-editor"></div></div>
              <div class="tab-pane" id="css-pane"><div class="ace-container" id="css-editor"></div></div>
              <div class="tab-pane" id="js-pane"><div class="ace-container" id="js-editor"></div></div>
            </div>

            <div class="preview-area" id="preview-container">
              <div class="preview-controls-left">
                <button aria-label="Maximizar preview" aria-pressed="false" class="preview-btn preview-btn-max" id="btn-preview-maximize" title="Maximizar preview" type="button">
                  <svg id="icon-preview-max" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                  <svg id="icon-preview-restore" style="display:none;" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
                </button>
              </div>
              <div class="preview-controls">
                <button aria-label="Alternar preview vertical" aria-pressed="false" class="preview-btn preview-btn-layout" id="btn-preview-layout" title="Alternar preview vertical" type="button">
                  <svg viewBox="0 0 24 24"><path d="M4 5h7v14H4V5zm9 0h7v14h-7V5zM6 7v10h3V7H6zm9 0v10h3V7h-3z"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <div id="cl-toast-root"></div>

  <!-- ==========================================================
       BOOT MÍNIMO DESTA PÁGINA
       O IDE não carrega assets/js/app.js (framework completo do
       Dashboard: router, páginas, componentes) — não precisa dele
       e evitamos amarrar o editor a elementos de UI que só existem
       no Dashboard (#cl-app, #cl-sidebar, etc.).
       Só que auth.js e api.js dependem de CL.config/CL.state
       existirem (normalmente definidos por app.js), então este
       bloco define a versão mínima necessária, no mesmo espírito
       do que já é feito em index.html para a Landing.
       ========================================================== -->
  <script>
    (function () {
      "use strict";

      window.CL = window.CL || {};
      var CL = window.CL;

      CL.config = Object.freeze({
        appName: "Coding Loop",
        debug: false,
        defaultTheme: "solarized-dark",
        defaultLanguage: "pt-BR",
        storagePrefix: "cl",
        landingUrl: "index.html",
        dashboardUrl: "dashboard.html",
        protectedPage: true,
        toastDuration: 3000
      });

      CL.state = {
        theme: CL.config.defaultTheme,
        user: null,
        authenticated: false,
        initialized: false
      };

      /* Toast mínimo (mesma marcação/classes cl-toast-* de global.css
         usadas na Landing), só pra CL.api._handleError conseguir
         avisar o aluno se uma gravação no Firestore falhar. */
      CL.ui = CL.ui || {};
      CL.ui.showToast = function (message, type, duration) {
        type = type || "info";
        duration = duration || CL.config.toastDuration;

        var root = document.getElementById("cl-toast-root");
        if (!root) return;

        var icons = { info: "ℹ", success: "✔", warning: "⚠", danger: "✖" };

        var toast = document.createElement("div");
        toast.className = "cl-toast cl-toast-" + type;
        toast.innerHTML =
          '<span class="cl-toast-icon">' + (icons[type] || icons.info) + '</span>' +
          '<div class="cl-toast-content"><span class="cl-toast-title"></span></div>' +
          '<button class="cl-toast-close" type="button">✖</button>';
        toast.querySelector(".cl-toast-title").textContent = message;
        root.appendChild(toast);

        var remove = function () { toast.remove(); };
        toast.querySelector(".cl-toast-close").addEventListener("click", remove);
        setTimeout(remove, duration);
      };
    })();
  </script>

  <script defer src="assets/js/firebase-init.js"></script>
  <script defer src="assets/js/auth.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/ide.js"></script>

</body>
</html>
