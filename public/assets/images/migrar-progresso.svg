<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <style>
    .tablet-body { fill: #e2e8f0; stroke: #073642; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .tablet-screen { fill: #002b36; }
    .camera { fill: #073642; }
    .phone-body { fill: #2aa198; stroke: #073642; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
    .phone-screen { fill: #ffffff; }
    .phone-btn { fill: #ffffff; stroke: #073642; stroke-width: 4; }
  </style>

  <!-- Tablet -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="450" height="320" rx="24" class="tablet-body" />
    <rect x="25" y="35" width="400" height="260" rx="8" class="tablet-screen" />
    <rect x="210" y="15" width="30" height="8" rx="4" class="camera" />
  </g>

  <!-- Smartphone -->
  <g transform="translate(410, 110)">
    <rect x="0" y="0" width="190" height="330" rx="24" class="phone-body" />
    <rect x="15" y="25" width="160" height="265" rx="8" class="phone-screen" />
    <circle cx="95" cy="305" r="10" class="phone-btn" />
  </g>

  <!-- Conjunto de Setas -->
  <g transform="translate(325, 175)">
    <!-- Seta Superior (Preenchida com #002b36 e contorno branco de 0.5) -->
    <g transform="translate(8, 0)">
      <path d="M 70 50 L 110 50 L 110 35 L 140 65 L 110 95 L 110 80 L 70 80" stroke="#ffffff" stroke-width="0.5" fill="#002b36" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <!-- Seta Inferior (Preenchida com branco e contorno #002b36 de 0.5) -->
    <g transform="translate(12, -28)">
      <path d="M 90 110 L 50 110 L 50 95 L 20 125 L 50 155 L 50 140 L 90 140" stroke="#002b36" stroke-width="0.5" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
