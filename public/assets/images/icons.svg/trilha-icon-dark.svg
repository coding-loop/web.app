      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- TRACEJADO agora dark #002b36 -->
  <path d="M 44 111
           C 34 121 32 129 32 137
           C 32 163 58 176 86 176
           L 128 176
           C 165 176 192 195 192 233
           C 192 261 172 286 148 289
           L 144 289"
