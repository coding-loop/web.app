      <g transform="translate(0, -44)">
        <ellipse cx="0" cy="48" rx="28" ry="11" fill="#002b36" stroke="#fdf6e3" stroke-width="3.75" filter="url(#shadow)"/>
        <path d="M 0 -42 C -18 -42 -34 -26 -34 -6 C -34 14 0 44 0 44 C 0 44 34 14 34 -6 C 34 -26 18 -42 0 -42 Z" 
