              fill="#fdf6e3" stroke="#002b36" stroke-width="6.25" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="-6" r="14" fill="none" stroke="#fdf6e3" stroke-width="11.25"/>
        <circle cx="0" cy="-6" r="14" fill="none" stroke="#002b36" stroke-width="6.25"/>
