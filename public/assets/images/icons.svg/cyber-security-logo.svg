<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <!-- Máscara para manter a matriz de código estritamente dentro do escudo -->
    <mask id="escudo-recorte">
      <path d="M 200,52 C 258,52 308,65 324,77 C 324,170 306,280 200,375 C 94,280 76,170 76,77 C 92,65 142,52 200,52 Z" fill="#FFFFFF" />
    </mask>

    <!-- Padrão da Matriz Criptográfica de Fundo (Verde Tecnológico) -->
    <pattern id="matrix-fundo" width="40" height="16" patternUnits="userSpaceOnUse">
      <text x="0" y="7.5" font-family="'Arial Narrow', sans-serif" font-weight="100" font-size="9" fill="#0FFF50" opacity="0.8" textLength="40" lengthAdjust="spacingAndGlyphs">K97AG89D</text>
      <text x="0" y="15.5" font-family="'Arial Narrow', sans-serif" font-weight="100" font-size="9" fill="#144d2e" opacity="0.7" textLength="40" lengthAdjust="spacingAndGlyphs">4A17DK02</text>
    </pattern>
  </defs>

  <!-- Corpo Principal do Logo -->
  <g transform="translate(0, 10)">
    
    <!-- 1. Fundo Sólido do Escudo -->
    <path d="M 200,52 C 258,52 308,65 324,77 C 324,170 306,280 200,375 C 94,280 76,170 76,77 C 92,65 142,52 200,52 Z" fill="#040d14" />

    <!-- 2. Preenchimento de Código Contínuo Mascarado -->
    <rect x="50" y="30" width="300" height="400" fill="url(#matrix-fundo)" mask="url(#escudo-recorte)" />

    <!-- 3. ÍCONE CENTRAL: CADEADO AMPLIADO EM MAIS 20% (Escala 1.44) -->
    <!-- Posição X ajustada para 145 para manter o centro perfeito com a nova escala -->
    <g transform="translate(145, 110) scale(1.44)">
      <!-- Alça do Cadeado (Ciano Neon) -->
      <path d="M 12,35 L 12,22 C 12,9 23,0 38,0 C 53,0 64,9 64,22 L 64,35" fill="none" stroke="#4fe3ff" stroke-width="7.5" stroke-linecap="round" />
      
      <!-- Corpo Sólido do Cadeado (Ciano Neon) -->
      <rect x="0" y="32" width="76" height="56" rx="6" fill="#4fe3ff" />
      
      <!-- Faixa Horizontal de Senha que cruza o cadeado (Cor do fundo escuro) -->
      <rect x="-8" y="48" width="92" height="24" rx="4" fill="#040d14" />

      <!-- Cinco Asteriscos alinhados perfeitamente dentro da faixa (Ciano Neon) -->
      <!-- Asterisco 1 -->
      <g transform="translate(-1, 60)" stroke="#4fe3ff" stroke-width="2.5" stroke-linecap="round">
        <line x1="-3.5" y1="0" x2="3.5" y2="0" /><line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" /><line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" /><line x1="0" y1="-3.5" x2="0" y2="3.5" />
      </g>
      <!-- Asterisco 2 -->
      <g transform="translate(18, 60)" stroke="#4fe3ff" stroke-width="2.5" stroke-linecap="round">
        <line x1="-3.5" y1="0" x2="3.5" y2="0" /><line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" /><line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" /><line x1="0" y1="-3.5" x2="0" y2="3.5" />
      </g>
      <!-- Asterisco 3 -->
      <g transform="translate(38, 60)" stroke="#4fe3ff" stroke-width="2.5" stroke-linecap="round">
        <line x1="-3.5" y1="0" x2="3.5" y2="0" /><line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" /><line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" /><line x1="0" y1="-3.5" x2="0" y2="3.5" />
      </g>
      <!-- Asterisco 4 -->
      <g transform="translate(58, 60)" stroke="#4fe3ff" stroke-width="2.5" stroke-linecap="round">
        <line x1="-3.5" y1="0" x2="3.5" y2="0" /><line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" /><line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" /><line x1="0" y1="-3.5" x2="0" y2="3.5" />
      </g>
      <!-- Asterisco 5 -->
      <g transform="translate(77, 60)" stroke="#4fe3ff" stroke-width="2.5" stroke-linecap="round">
        <line x1="-3.5" y1="0" x2="3.5" y2="0" /><line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" /><line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" /><line x1="0" y1="-3.5" x2="0" y2="3.5" />
      </g>

      <!-- SELO DE SEGURO (Ícone Check / Visto de Aprovação) -->
      <circle cx="76" cy="80" r="16" fill="#040d14" />
      <circle cx="76" cy="80" r="13" fill="#0FFF50" />
      <path d="M 70,80 L 74,84 L 83,75" fill="none" stroke="#040d14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 4. Escudo Externo (Borda Grossa Tecnológica) -->
    <path d="M 200,30 C 270,30 330,45 350,60 C 350,170 330,300 200,410 C 70,300 50,170 50,60 C 70,45 130,30 200,30 Z" 
          fill="none" 
          stroke="#102a3d" 
          stroke-width="14" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- 5. Escudo Interno (Borda Fina de Contorno Ciano Neon) -->
    <path d="M 200,52 C 258,52 308,65 324,77 C 324,170 306,280 200,375 C 94,280 76,170 76,77 C 92,65 142,52 200,52 Z" 
          fill="none" 
          stroke="#1f5d7a" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
